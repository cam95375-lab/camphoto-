<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <meta name="google-site-verification" content="IJnvnGCsJuBmwifrcVlcahsjlj9aAdRuC7bWipzknmw"><title>CamPhotoEditor AI</title> <style> *{ box-sizing:border-box; margin:0; padding:0; } body{ font-family:Arial,Helvetica,sans-serif; background:#070a10; color:#fff; min-height:100vh; } button,input{ font:inherit; } button{ -webkit-tap-highlight-color:transparent; } .app{ min-height:100vh; } /* TOP BAR */ .topbar{ height:68px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; background:#0c1018; border-bottom:1px solid #202735; position:sticky; top:0; z-index:50; } .logo{ font-size:22px; font-weight:800; letter-spacing:-.5px; } .logo span{ color:#7186ff; } .badge{ padding:7px 12px; border-radius:20px; background:#171e32; border:1px solid #303b63; color:#aab8ff; font-size:11px; font-weight:700; } /* MAIN */ .main{ display:grid; grid-template-columns:minmax(0,1fr) 340px; min-height:calc(100vh - 68px); } .workspace{ padding:22px; display:flex; flex-direction:column; gap:16px; } /* UPLOAD */ .upload{ min-height:190px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:30px 18px; border:2px dashed #30394c; border-radius:22px; background:#0d121b; cursor:pointer; transition:.2s; } .upload:hover{ border-color:#7186ff; background:#111827; } .upload:active{ transform:scale(.99); } .upload-icon{ font-size:42px; margin-bottom:10px; } .upload h2{ font-size:21px; margin-bottom:7px; } .upload p{ color:#8994a8; font-size:13px; } .upload input{ display:none; } /* EDITOR */ .editor{ display:none; position:relative; min-height:500px; background:#030509; border:1px solid #222a38; border-radius:22px; overflow:hidden; } .image-area{ width:100%; min-height:500px; padding:22px; display:flex; align-items:center; justify-content:center; } #photo{ max-width:100%; max-height:70vh; object-fit:contain; transform-origin:center; user-select:none; transition:.15s; border-radius:6px; } .empty{ color:#596273; text-align:center; } .compare{ display:none; position:absolute; left:14px; top:14px; z-index:5; padding:8px 12px; border-radius:10px; background:#151b26; border:1px solid #30394a; color:#fff; font-size:11px; } /* PANEL */ .panel{ padding:20px; background:#0c1018; border-left:1px solid #202735; overflow-y:auto; } .panel-title{ font-size:18px; font-weight:800; margin-bottom:18px; } .section{ margin-bottom:21px; } .section-title{ margin-bottom:9px; color:#8994a8; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; } /* TOOLS */ .tools{ display:grid; grid-template-columns:1fr 1fr; gap:8px; } .tool{ min-height:45px; padding:9px 7px; border-radius:12px; border:1px solid #293142; background:#151b26; color:#fff; cursor:pointer; font-size:12px; transition:.2s; } .tool:hover{ background:#20293a; border-color:#52638d; } .tool:active{ transform:scale(.97); } .tool.aiTool{ border-color:#35406b; } .tool.aiTool:hover{ background:#26325a; border-color:#7186ff; } /* CONTROLS */ .control{ margin-bottom:15px; } .control-head{ display:flex; justify-content:space-between; margin-bottom:7px; font-size:13px; } .value{ color:#8da1ff; font-weight:700; } input[type=range]{ width:100%; accent-color:#7186ff; } /* ACTIONS */ .action{ width:100%; min-height:47px; border:0; border-radius:13px; margin-top:8px; cursor:pointer; font-weight:800; } .ai{ color:#fff; background:linear-gradient(135deg,#667cff,#8b5cf6); } .download{ color:#080b12; background:#fff; } .secondary{ color:#fff; background:#171d28; border:1px solid #2b3445; } .action:active{ transform:scale(.98); } /* STATUS */ .status{ display:none; margin-top:12px; padding:12px; border-radius:11px; background:#171d28; border:1px solid #2b3445; color:#b8c1d2; font-size:12px; line-height:1.5; } .status.success{ border-color:#315f48; color:#9de0b8; } .status.error{ border-color:#6a3636; color:#ffaaaa; } .status.loading{ border-color:#405184; color:#b8c5ff; } /* LOADING */ .loading{ display:none; position:absolute; inset:0; z-index:30; align-items:center; justify-content:center; background:rgba(3,5,9,.72); backdrop-filter:blur(5px); } .loading-box{ text-align:center; padding:22px; border-radius:18px; background:#111722; border:1px solid #303a50; } .spinner{ width:34px; height:34px; margin:0 auto 12px; border:3px solid #30394c; border-top-color:#7186ff; border-radius:50%; animation:spin .8s linear infinite; } @keyframes spin{ to{ transform:rotate(360deg); } } /* MOBILE */ @media(max-width:850px){ .topbar{ height:62px; padding:0 14px; } .logo{ font-size:18px; } .badge{ font-size:9px; padding:6px 8px; } .main{ display:block; } .workspace{ padding:12px; } .editor{ min-height:55vh; } .image-area{ min-height:55vh; padding:12px; } #photo{ max-height:52vh; } .panel{ border-left:0; border-top:1px solid #202735; padding:16px; } } @media(max-width:430px){ .upload{ min-height:170px; } .upload h2{ font-size:19px; } .tool{ font-size:10px; min-height:52px; } } </style> </head> <body> <div class="app"> <!-- TOP BAR --> <header class="topbar"> <div class="logo"> Cam<span>PhotoEditor</span> </div> <div class="badge"> ✨ AI PHOTO EDITOR </div> </header> <main class="main"> <!-- WORKSPACE --> <section class="workspace"> <label class="upload" id="uploadBox"> <div class="upload-icon">📸</div> <h2>Upload Your Photo</h2> <p>JPG, PNG, WEBP — Tap to choose a photo</p> <input type="file" id="fileInput" accept="image/*" > </label> <!-- EDITOR --> <div class="editor" id="editor"> <div class="compare" id="compare"> Original </div> <div class="image-area"> <div class="empty" id="emptyText"> Your photo will appear here </div> <img id="photo" alt="Edited photo" > </div> <!-- LOADING --> <div class="loading" id="loading"> <div class="loading-box"> <div class="spinner"></div> <div id="loadingText"> Processing... </div> </div> </div> </div> </section> <!-- RIGHT PANEL --> <aside class="panel"> <div class="panel-title"> Photo Editor </div> <!-- AI TOOLS --> <div class="section"> <div class="section-title"> AI Tools </div> <div class="tools"> <button class="tool aiTool" data-ai="enhance"> ✨ AI Enhance </button> <button class="tool aiTool" data-ai="upscale"> 🔍 HD Upscale </button> <button class="tool aiTool" data-ai="face"> 👤 Face Enhance </button> <button class="tool aiTool" data-ai="denoise"> 🧹 Denoise </button> </div> </div> <!-- ADJUST --> <div class="section"> <div class="section-title"> Adjust </div> <div class="control"> <div class="control-head"> <span>Brightness</span> <span class="value" id="brightnessValue"> 100 </span> </div> <input id="brightness" type="range" min="50" max="150" value="100" > </div> <div class="control"> <div class="control-head"> <span>Contrast</span> <span class="value" id="contrastValue"> 100 </span> </div> <input id="contrast" type="range" min="50" max="150" value="100" > </div> <div class="control"> <div class="control-head"> <span>Saturation</span> <span class="value" id="saturationValue"> 100 </span> </div> <input id="saturation" type="range" min="0" max="200" value="100" > </div> <div class="control"> <div class="control-head"> <span>Sharpness</span> <span class="value" id="sharpnessValue"> 0 </span> </div> <input id="sharpness" type="range" min="0" max="100" value="0" > </div> </div> <!-- TRANSFORM --> <div class="section"> <div class="section-title"> Transform </div> <div class="tools"> <button class="tool" id="rotateLeft"> ↶ Rotate </button> <button class="tool" id="rotateRight"> ↷ Rotate </button> <button class="tool" id="flip"> ↔ Flip </button> <button class="tool" id="beforeAfter"> 👁 Before </button> </div> </div> <!-- ACTIONS --> <button class="action download" id="download"> ⬇️ Download Photo </button> <button class="action secondary" id="reset"> ↩️ Reset Editor </button> <!-- STATUS --> <div class="status" id="status"> </div> </aside> </main> </div> <script> /* ===================================================== CAMPHOTOEDITOR AI GOOGLE APPS SCRIPT BACKEND ===================================================== */ const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwW_1SRpv6jBB9L1tw-NBQzNSzmQDetfruL3Cxm-8YFtANI3zL59X3EyPylXxrUWbae3w/exec"; /* ===================================================== ELEMENTS ===================================================== */ const fileInput = document.getElementById("fileInput"); const uploadBox = document.getElementById("uploadBox"); const editor = document.getElementById("editor"); const photo = document.getElementById("photo"); const emptyText = document.getElementById("emptyText"); const status = document.getElementById("status"); const compare = document.getElementById("compare"); const loading = document.getElementById("loading"); const loadingText = document.getElementById("loadingText"); const brightness = document.getElementById("brightness"); const contrast = document.getElementById("contrast"); const saturation = document.getElementById("saturation"); const sharpness = document.getElementById("sharpness"); const brightnessValue = document.getElementById("brightnessValue"); const contrastValue = document.getElementById("contrastValue"); const saturationValue = document.getElementById("saturationValue"); const sharpnessValue = document.getElementById("sharpnessValue"); /* ===================================================== VARIABLES ===================================================== */ let originalImage = ""; let originalFileName = ""; let originalMimeType = "image/jpeg"; let rotation = 0; let flipped = false; let beforeMode = false; /* ===================================================== FILE UPLOAD ===================================================== */ fileInput.addEventListener( "change", async function(){ const file = this.files[0]; if(!file){ return; } if(!file.type.startsWith("image/")){ showStatus( "Please select a valid image.", "error" ); return; } originalFileName = file.name; originalMimeType = file.type || "image/jpeg"; const reader = new FileReader(); reader.onload = async function(e){ originalImage = e.target.result; photo.src = originalImage; emptyText.style.display = "none"; uploadBox.style.display = "none"; editor.style.display = "block"; resetValues(); showStatus( "📤 Uploading photo to CamPDF AI...", "loading" ); await uploadToGoogleDrive(file); }; reader.readAsDataURL(file); }); /* ===================================================== GOOGLE DRIVE UPLOAD ===================================================== */ async function uploadToGoogleDrive(file){ try{ const response = await fetch( GOOGLE_SCRIPT_URL, { method:"POST", headers:{ "Content-Type": "text/plain;charset=utf-8" }, body:JSON.stringify({ image:originalImage, mimeType: file.type || "image/jpeg", fileName: file.name, action: "upload" }) } ); const result = await response.json(); if(result.success){ showStatus( "✅ Photo uploaded successfully to CamPDF AI.", "success" ); }else{ showStatus( "❌ Upload failed: " + (result.error || "Unknown error"), "error" ); } }catch(error){ console.error( "Upload error:", error ); showStatus( "⚠️ Photo opened successfully, but server connection failed.", "error" ); } } /* ===================================================== FILTER SYSTEM ===================================================== */ function updateImage(){ if(!photo.src){ return; } if(beforeMode){ photo.style.filter = "none"; return; } const b = brightness.value; const c = contrast.value; const s = saturation.value; const sh = sharpness.value; photo.style.filter = `brightness(${b}%) contrast(${Number(c) + Number(sh)/3}%) saturate(${s}%)`; } /* BRIGHTNESS */ brightness.addEventListener( "input", function(){ brightnessValue.textContent = brightness.value; updateImage(); }); /* CONTRAST */ contrast.addEventListener( "input", function(){ contrastValue.textContent = contrast.value; updateImage(); }); /* SATURATION */ saturation.addEventListener( "input", function(){ saturationValue.textContent = saturation.value; updateImage(); }); /* SHARPNESS */ sharpness.addEventListener( "input", function(){ sharpnessValue.textContent = sharpness.value; updateImage(); }); /* ===================================================== ROTATE ===================================================== */ document .getElementById("rotateLeft") .addEventListener( "click", function(){ rotation -= 90; updateTransform(); }); document .getElementById("rotateRight") .addEventListener( "click", function(){ rotation += 90; updateTransform(); }); function updateTransform(){ const flipValue = flipped ? -1 : 1; photo.style.transform = `rotate(${rotation}deg) scaleX(${flipValue})`; } /* ===================================================== FLIP ===================================================== */ document .getElementById("flip") .addEventListener( "click", function(){ flipped = !flipped; updateTransform(); }); /* ===================================================== BEFORE / AFTER ===================================================== */ document .getElementById("beforeAfter") .addEventListener( "click", function(){ beforeMode = !beforeMode; if(beforeMode){ compare.style.display = "block"; compare.textContent = "Original"; photo.style.filter = "none"; }else{ compare.style.display = "none"; updateImage(); } }); /* ===================================================== AI TOOLS ===================================================== */ document .querySelectorAll(".aiTool") .forEach( button => { button.addEventListener( "click", async function(){ if(!originalImage){ showStatus( "Please upload a photo first.", "error" ); return; } const type = this.dataset.ai; const names = { enhance: "✨ AI Enhance", upscale: "🔍 HD Upscale", face: "👤 Face Enhance", denoise: "🧹 Denoise" }; loadingText.textContent = names[type] + " selected..."; loading.style.display = "flex"; showStatus( names[type] + " request started...", "loading" ); try{ const response = await fetch( GOOGLE_SCRIPT_URL, { method:"POST", headers:{ "Content-Type": "text/plain;charset=utf-8" }, body:JSON.stringify({ image: originalImage, mimeType: originalMimeType, fileName: originalFileName, action: type }) } ); const result = await response.json(); if(result.success){ showStatus( "✅ " + names[type] + " request sent successfully.", "success" ); }else{ showStatus( "❌ AI request failed: " + (result.error || "Unknown error"), "error" ); } }catch(error){ console.error( "AI error:", error ); showStatus( "⚠️ AI server connection failed.", "error" ); } loading.style.display = "none"; }); }); /* ===================================================== RESET ===================================================== */ document .getElementById("reset") .addEventListener( "click", function(){ resetValues(); }); function resetValues(){ brightness.value = 100; contrast.value = 100; saturation.value = 100; sharpness.value = 0; brightnessValue.textContent = "100"; contrastValue.textContent = "100"; saturationValue.textContent = "100"; sharpnessValue.textContent = "0"; rotation = 0; flipped = false; beforeMode = false; compare.style.display = "none"; photo.style.transform = "rotate(0deg) scaleX(1)"; photo.style.filter = "none"; status.style.display = "none"; } /* ===================================================== DOWNLOAD ===================================================== */ document .getElementById("download") .addEventListener( "click", function(){ if(!originalImage){ showStatus( "Please upload a photo first.", "error" ); return; } const canvas = document.createElement("canvas"); const ctx = canvas.getContext("2d"); const image = new Image(); image.onload = function(){ canvas.width = image.naturalWidth; canvas.height = image.naturalHeight; ctx.filter = `brightness(${brightness.value}%) contrast(${Number(contrast.value) + Number(sharpness.value)/3}%) saturate(${saturation.value}%)`; ctx.save(); ctx.translate( canvas.width / 2, canvas.height / 2 ); ctx.rotate( rotation * Math.PI / 180 ); ctx.scale( flipped ? -1 : 1, 1 ); ctx.drawImage( image, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height ); ctx.restore(); const link = document.createElement("a"); link.download = "CamPhotoEditor-AI.png"; link.href = canvas.toDataURL( "image/png" ); document.body.appendChild( link ); link.click(); link.remove(); showStatus( "✅ Edited photo downloaded.", "success" ); }; image.src = originalImage; }); /* ===================================================== STATUS ===================================================== */ function showStatus( message, type = "" ){ status.textContent = message; status.className = "status"; if(type){ status.classList.add( type ); } status.style.display = "block"; } </script> </body> </html>
